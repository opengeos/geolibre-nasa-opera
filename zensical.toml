# Zensical configuration for the NASA OPERA plugin site.
# https://zensical.org/docs/

[project]
site_name = "NASA OPERA for GeoLibre"
site_description = """
A GeoLibre plugin that searches NASA OPERA products through CMR, renders them \
with titiler-cmr, and turns a place and a date range into a flood impact \
one-pager."""
site_author = "Qiusheng Wu"
site_url = "https://opera-plugin.geolibre.app/"
docs_dir = "docs"
site_dir = "site"
copyright = """
MIT licensed &middot;
<a href="https://github.com/opengeos/geolibre-nasa-opera">opengeos/geolibre-nasa-opera</a>
"""

nav = [
  { "Overview" = "index.md" },
  { "Products" = "products.md" },
  { "GeoAgent" = "geoagent.md" },
  { "Flood workflow" = "flood-workflow.md" },
  { "Install" = "install.md" },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Archivo"
code = "IBM Plex Mono"

[project.theme.icon]
logo = "lucide/satellite"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/opengeos/geolibre-nasa-opera"
name = "Source on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@giswqs"
name = "Video demos"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tilde]
